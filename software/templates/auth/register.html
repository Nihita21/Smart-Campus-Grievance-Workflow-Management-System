{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-6">
    <div class="card p-4">
      <div class="text-center mb-4">
        <i class="bi bi-person-plus fs-1" style="color:#1a3c5e;"></i>
        <h4 class="fw-bold mt-2">Create Account</h4>
      </div>
      <form method="POST" action="{{ url_for('auth.register') }}">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">Full Name</label>
            <input type="text" name="name" class="form-control" placeholder="Enter your name..." required/>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">Phone Number</label>
            <input type="text" name="phone" class="form-control" placeholder="Enter your phone number..." required/>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Email Address</label>
          <input type="email" name="email" class="form-control" placeholder="you@upes.ac.in" required/>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Role</label>
          <select name="role" class="form-select">
            <option value="student">Student</option>
            <option value="staff">Staff</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" name="password" class="form-control" placeholder="Min. 6 characters" required/>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Confirm Password</label>
          <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter password" required/>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
          <i class="bi bi-person-check me-1"></i>Register
        </button>
      </form>
      <hr/>
      <p class="text-center text-muted mb-0">Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></p>
    </div>
  </div>
</div>
{% endblock %}
